[project]
name = "nemoclaw-rag-base"
version = "0.1.0"
description = "Minimal NemoClaw + OpenShell + OpenClaw/Hermes base with a MongoDB RAG scaffold and smoke test."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymongo>=4.6",
]

[project.optional-dependencies]
llm = ["httpx>=0.27"]

[project.scripts]
rag-ingest = "scripts.ingest:main"
rag-query = "scripts.query:main"
rag-smoke = "scripts.smoke_test:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag*", "scripts*"]
